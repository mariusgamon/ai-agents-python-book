# Run the tests from day5/:  cd day5 && pytest tests/
[pytest]
pythonpath = .
testpaths = tests
# A single asyncio loop for the whole session: the SDK's OpenAI client reuses
# its HTTP connections, which stay tied to the first test's loop.
# Without it: “RuntimeError: Event loop is closed” from the 2nd test that calls the LLM.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
